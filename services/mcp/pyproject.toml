[project]
name = "troka-mcp"
version = "0.1.0"
description = "Servidor MCP do TroKa: expõe as RPCs do Supabase como tools, sempre com o JWT do usuário."
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.28",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.22"]

[project.scripts]
troka-mcp = "troka_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/troka_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
